<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>OpenAudio32</title>

    <link
        rel="stylesheet"
        href="/css/app.css?v=3"
    >

    <link
        rel="stylesheet"
        href="/css/player.css?v=3"
    >

    <link
        rel="stylesheet"
        href="/css/stations.css?v=3"
    >

    <link
        rel="stylesheet"
        href="/css/system.css?v=3"
    >
    <link
    rel="stylesheet"
    href="/css/audio.css?v=1"
>
<link
    rel="stylesheet"
    href="/css/audio.css?v=1"
>

</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    OA
                </div>

                <div>
                    <h1>
                        OpenAudio32
                    </h1>

                    <span>
                        Network Audio Player
                    </span>
                </div>
            </div>

            <nav class="navigation">
                <button
                    class="nav-item active"
                    data-page="player"
                    type="button"
                >
                    <span class="nav-icon">
                        ▶
                    </span>

                    <span>
                        Player
                    </span>
                </button>

                <button
                    class="nav-item"
                    data-page="stations"
                    type="button"
                >
                    <span class="nav-icon">
                        ◉
                    </span>

                    <span>
                        Radiosender
                    </span>
                </button>

                <button
                    class="nav-item"
                    data-page="audio"
                    type="button"
                >
                    <span class="nav-icon">
                        ≋
                    </span>

                    <span>
                        Audio
                    </span>
                </button>

                <button
                    class="nav-item"
                    data-page="wifi"
                    type="button"
                >
                    <span class="nav-icon">
                        ⌁
                    </span>

                    <span>
                        WLAN
                    </span>
                </button>

                <button
                    class="nav-item"
                    data-page="spotify"
                    type="button"
                >
                    <span class="nav-icon">
                        ♪
                    </span>

                    <span>
                        Spotify
                    </span>
                </button>

                <button
                    class="nav-item"
                    data-page="system"
                    type="button"
                >
                    <span class="nav-icon">
                        ⚙
                    </span>

                    <span>
                        System
                    </span>
                </button>
            </nav>

            <div class="sidebar-bottom">
                <div class="sidebar-status">
                    <span class="status-dot"></span>

                    <div>
                        <strong>
                            Gerät online
                        </strong>

                        <span id="deviceIp">
                            –
                        </span>
                    </div>
                </div>

                <div class="sidebar-footer">
                    <span>
                        © 2026 Stephan Thiel
                    </span>

                    <span>
                        OpenAudio32
                    </span>

                    <span>
                        Alle Rechte vorbehalten.
                    </span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button
                    id="menuButton"
                    class="menu-button"
                    type="button"
                    aria-label="Menü öffnen"
                >
                    ☰
                </button>

                <div>
                    <span
                        id="pageEyebrow"
                        class="eyebrow"
                    >
                        Jetzt läuft
                    </span>

                    <h2 id="pageTitle">
                        Player
                    </h2>
                </div>

                <div class="topbar-status">
                    <span>
                        WLAN
                    </span>

                    <strong id="topbarRssi">
                        – dBm
                    </strong>
                </div>
            </header>

            <div
                id="pageContent"
                class="page-content"
                aria-live="polite"
            >
                <div class="page-loading">
                    Seite wird geladen …
                </div>
            </div>
        </main>
    </div>

    <div
        id="modalContainer"
        class="modal-container"
    ></div>

    <script src="/js/api.js?v=3"></script>
    <script src="/js/player.js?v=3"></script>
    <script src="/js/stations.js?v=3"></script>
    <script src="/js/audio.js?v=1"></script>
    <script src="/js/wifi.js?v=1"></script>
    <script src="/js/system.js?v=3"></script>
    <script src="/js/app.js?v=3"></script>
</body>
</html>
